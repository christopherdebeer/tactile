name: Firmware build
on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/firmware-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Afterword and interior world state machines
        run: |
          flags="-std=c11 -Wall -Wextra -Werror -Ifirmware/main"
          gcc $flags -DTACTILE_VERSION='"test"' tests/afterword.c \
            firmware/main/afterword.c firmware/main/world.c -lm -o afterword
          gcc $flags tests/world.c firmware/main/world.c -lm -o world
          ./afterword && ./world
      - name: Telemetry stream tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'

  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.3
    steps:
      - uses: actions/checkout@v4
      - name: Compile AtomS3R firmware
        working-directory: firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: tactile-firmware-ci
          if-no-files-found: error
          path: |
            firmware/build/tactile.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
